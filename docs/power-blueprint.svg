<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d63031"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00a86b"/></marker>
    <!-- ground symbol: its top point is the connection point -->
    <g id="gnd" stroke="#2d3436" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="9"/><line x1="-11" y1="9" x2="11" y2="9"/><line x1="-7" y1="14" x2="7" y2="14"/><line x1="-3" y1="19" x2="3" y2="19"/>
    </g>
  </defs>
  <rect width="960" height="850" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1e272e">Power and battery telemetry</text>

  <!-- legend -->
  <g font-size="14" fill="#2d3436">
    <line x1="60" y1="58" x2="96" y2="58" stroke="#d63031" stroke-width="4"/><text x="104" y="63">power (+)</text>
    <line x1="210" y1="58" x2="246" y2="58" stroke="#00a86b" stroke-width="4"/><text x="254" y="63">signal</text>
    <use href="#gnd" x="350" y="48"/><text x="372" y="63">ground (all grounds are joined)</text>
  </g>

  <!-- ===== LOAD PATH: battery -> fuse -> switch -> (gauge) -> XL6009 -> panel + ESP32 ===== -->
  <text x="40" y="100" font-size="15" font-weight="700" fill="#d63031">Load path: everything the scoreboard uses</text>

  <rect x="30" y="190" width="120" height="90" rx="14" fill="#fff4e0" stroke="#e67e22" stroke-width="3"/>
  <text x="90" y="224" text-anchor="middle" font-size="18" font-weight="700" fill="#1e272e">LiPo cell</text>
  <text x="90" y="246" text-anchor="middle" font-size="13" fill="#2d3436">3.7 - 4.2 V</text>
  <text x="90" y="264" text-anchor="middle" font-size="12" fill="#636e72">protected pack</text>
  <text x="156" y="226" font-size="15" font-weight="700" fill="#d63031">+</text>
  <text x="96" y="276" font-size="18" font-weight="700" fill="#2d3436">-</text>
  <use href="#gnd" x="90" y="280"/>

  <!-- + wire: battery, charger junction, fuse, switch, gauge, XL6009 -->
  <line x1="150" y1="235" x2="172" y2="235" stroke="#d63031" stroke-width="4"/>
  <circle cx="162" cy="235" r="6" fill="#d63031"/>
  <rect x="172" y="224" width="50" height="22" rx="4" fill="#ffecec" stroke="#d63031" stroke-width="3"/>
  <text x="197" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#d63031">FUSE 5 A</text>
  <line x1="222" y1="235" x2="244" y2="235" stroke="#d63031" stroke-width="4"/>
  <rect x="244" y="213" width="92" height="44" rx="8" fill="#e8f1ff" stroke="#2f6fed" stroke-width="3"/>
  <text x="290" y="239" text-anchor="middle" font-size="15" font-weight="700" fill="#1e272e">Switch</text>
  <text x="290" y="252" text-anchor="middle" font-size="11" fill="#2d3436">10 A or more</text>
  <line x1="336" y1="235" x2="356" y2="235" stroke="#d63031" stroke-width="4"/>
  <rect x="356" y="205" width="116" height="60" rx="10" fill="#f4f4f4" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="414" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#1e272e">Volt/amp gauge</text>
  <text x="414" y="250" text-anchor="middle" font-size="11" fill="#2d3436">optional, in series</text>
  <line x1="472" y1="235" x2="506" y2="235" stroke="#d63031" stroke-width="4"/>
  <circle cx="490" cy="235" r="6" fill="#d63031"/>

  <!-- XL6009 -->
  <rect x="506" y="190" width="160" height="90" rx="12" fill="#e8f1ff" stroke="#2f6fed" stroke-width="3"/>
  <text x="586" y="222" text-anchor="middle" font-size="18" font-weight="700" fill="#1e272e">XL6009 boost</text>
  <text x="586" y="244" text-anchor="middle" font-size="13" fill="#2d3436">battery in, 5.0 V out</text>
  <text x="586" y="262" text-anchor="middle" font-size="12" fill="#636e72">set it before connecting</text>
  <use href="#gnd" x="586" y="280"/>

  <!-- 5 V rail -->
  <line x1="666" y1="235" x2="710" y2="235" stroke="#d63031" stroke-width="4"/>
  <line x1="710" y1="172" x2="710" y2="352" stroke="#d63031" stroke-width="4"/>
  <circle cx="710" cy="235" r="6" fill="#d63031"/>
  <line x1="710" y1="172" x2="790" y2="172" stroke="#d63031" stroke-width="4" marker-end="url(#arrRed)"/>
  <line x1="710" y1="352" x2="790" y2="352" stroke="#d63031" stroke-width="4" marker-end="url(#arrRed)"/>
  <text x="750" y="162" text-anchor="middle" font-size="12" fill="#d63031">5 V, 1-1.5 A</text>
  <text x="750" y="342" text-anchor="middle" font-size="12" fill="#d63031">5 V, 0.2 A</text>

  <rect x="790" y="122" width="140" height="100" rx="14" fill="#f3ecff" stroke="#8e44ad" stroke-width="3"/>
  <text x="860" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#1e272e">P4 80x40 panel</text>
  <text x="860" y="176" text-anchor="middle" font-size="12" fill="#2d3436">4-pin POWER header:</text>
  <text x="860" y="194" text-anchor="middle" font-size="12" fill="#2d3436">both VCC + both GND</text>
  <use href="#gnd" x="860" y="222"/>

  <rect x="790" y="302" width="140" height="100" rx="14" fill="#eaf8ef" stroke="#00a86b" stroke-width="3"/>
  <text x="860" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#1e272e">ESP32-S3 N16R8</text>
  <text x="860" y="356" text-anchor="middle" font-size="12" fill="#2d3436">5V pin: power</text>
  <text x="860" y="374" text-anchor="middle" font-size="12" fill="#2d3436">GPIO 18: battery sense</text>
  <use href="#gnd" x="860" y="402"/>

  <!-- ===== CHARGE PATH ===== -->
  <text x="40" y="352" font-size="15" font-weight="700" fill="#0f6e56">Charge path:</text><text x="40" y="370" font-size="12" fill="#0f6e56">only fills the cell</text>
  <rect x="30" y="378" width="200" height="74" rx="12" fill="#e1f5ee" stroke="#0f6e56" stroke-width="3"/>
  <text x="130" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#1e272e">Charge board (TP4056)</text>
  <text x="130" y="426" text-anchor="middle" font-size="12" fill="#2d3436">B+ and B- on the cell only.</text>
  <text x="130" y="442" text-anchor="middle" font-size="12" fill="#2d3436">Nothing is drawn from its output.</text>
  <polyline points="162,235 162,378" fill="none" stroke="#d63031" stroke-width="4"/>
  <text x="172" y="300" font-size="12" fill="#d63031">B+</text>
  <use href="#gnd" x="70" y="452"/>
  <rect x="30" y="484" width="200" height="34" rx="8" fill="#fff" stroke="#2d3436" stroke-width="2"/>
  <text x="130" y="506" text-anchor="middle" font-size="14" fill="#1e272e">5 V USB charger</text>
  <line x1="170" y1="484" x2="170" y2="456" stroke="#d63031" stroke-width="4" marker-end="url(#arrRed)"/>

  <text x="270" y="400" font-size="13" fill="#2d3436">The cell charges whether the switch is on or off.</text>
  <text x="270" y="420" font-size="13" fill="#2d3436">The charge board gets warm: use a hard surface, keep it ventilated,</text>
  <text x="270" y="438" font-size="13" fill="#2d3436">and charge with the scoreboard off.</text>
  <text x="270" y="470" font-size="13" fill="#636e72">If it is too hot to touch, unplug it. A pack of 6 Ah or more needs a faster, cooler charger.</text>
  <text x="270" y="500" font-size="13" fill="#636e72">Join every ground: cell, charge board, XL6009, ESP32 and panel (the HUB75 ribbon carries one too).</text>

  <!-- ===== DIVIDER AND TELEMETRY ===== -->
  <line x1="40" y1="548" x2="920" y2="548" stroke="#dfe6e9" stroke-width="2"/>
  <text x="40" y="580" font-size="20" font-weight="700" fill="#1e272e">Battery voltage divider and telemetry</text>

  <text x="40" y="640" font-size="15" font-weight="700" fill="#d63031">BAT+ (after the switch)</text>
  <line x1="215" y1="635" x2="250" y2="635" stroke="#d63031" stroke-width="4"/>
  <rect x="250" y="617" width="110" height="36" rx="6" fill="#fff" stroke="#2d3436" stroke-width="3"/>
  <text x="305" y="641" text-anchor="middle" font-size="16" fill="#1e272e">10 kΩ</text>
  <line x1="360" y1="635" x2="490" y2="635" stroke="#00a86b" stroke-width="4"/>
  <circle cx="420" cy="635" r="7" fill="#00a86b"/>
  <rect x="490" y="617" width="110" height="36" rx="6" fill="#fff" stroke="#2d3436" stroke-width="3"/>
  <text x="545" y="641" text-anchor="middle" font-size="16" fill="#1e272e">10 kΩ</text>
  <line x1="600" y1="635" x2="640" y2="635" stroke="#2d3436" stroke-width="4"/>
  <line x1="640" y1="635" x2="640" y2="649" stroke="#2d3436" stroke-width="3"/>
  <use href="#gnd" x="640" y="643"/>
  <text x="660" y="640" font-size="16" font-weight="700" fill="#2d3436">GND</text>
  <text x="432" y="607" font-size="13" fill="#2d3436">midpoint = half the cell voltage (1.7 - 2.1 V)</text>

  <polyline points="420,635 420,681 115,681 115,707" fill="none" stroke="#00a86b" stroke-width="4" marker-end="url(#arrGreen)"/>

  <g stroke-width="3">
    <rect x="40" y="709" width="150" height="92" rx="12" fill="#eaf8ef" stroke="#00a86b"/>
    <rect x="222" y="709" width="150" height="92" rx="12" fill="#fff" stroke="#7f8c8d"/>
    <rect x="404" y="709" width="150" height="92" rx="12" fill="#fff" stroke="#7f8c8d"/>
    <rect x="586" y="709" width="150" height="92" rx="12" fill="#e8f1ff" stroke="#2f6fed"/>
    <rect x="768" y="709" width="150" height="92" rx="12" fill="#f3ecff" stroke="#8e44ad"/>
  </g>
  <g text-anchor="middle" fill="#2d3436" font-size="13">
    <text x="115" y="735" font-size="15" font-weight="700" fill="#1e272e">GPIO 18 (ADC)</text><text x="115" y="759">reading, average</text><text x="115" y="777">of 10 samples</text>
    <text x="297" y="735" font-size="15" font-weight="700" fill="#1e272e">Double it</text><text x="297" y="759">the divider halves</text><text x="297" y="777">the voltage</text>
    <text x="479" y="735" font-size="15" font-weight="700" fill="#1e272e">Map to percent</text><text x="479" y="759">3.4 V = 0 %</text><text x="479" y="777">4.2 V = 100 %</text>
    <text x="661" y="735" font-size="15" font-weight="700" fill="#1e272e">Telemetry packet</text><text x="661" y="759">byte 4: 0-100 %</text><text x="661" y="777">flag bit 0: below 15 %</text>
    <text x="843" y="735" font-size="15" font-weight="700" fill="#1e272e">Phone app</text><text x="843" y="759">battery icon, red</text><text x="843" y="777">below 15 %</text>
  </g>
  <g stroke="#00a86b" stroke-width="4">
    <line x1="190" y1="755" x2="220" y2="755" marker-end="url(#arrGreen)"/>
    <line x1="372" y1="755" x2="402" y2="755" marker-end="url(#arrGreen)"/>
    <line x1="554" y1="755" x2="584" y2="755" marker-end="url(#arrGreen)"/>
    <line x1="736" y1="755" x2="766" y2="755" marker-end="url(#arrGreen)"/>
  </g>
  <text x="661" y="821" text-anchor="middle" font-size="13" fill="#2d3436">sent over Bluetooth every 2 s</text>
  <text x="40" y="839" font-size="12" fill="#636e72">The divider is after the switch, so it draws about 0.2 mA only while the scoreboard is on. The reading is taken under load: a rough gauge.</text>
</svg>
